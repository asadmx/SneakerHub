<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SneakerHub – Product Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-primary { background-color: #111111; }
        .bg-accent { background-color: #00C853; }
        .bg-cta { background-color: #FF3D00; }
        .hover-bg-cta:hover { background-color: #e63600; }
        .text-primary { color: #222222; }
        .text-subtext { color: #666666; }
        .text-accent { color: #00C853; }

        /* Size button styles */
        .size-btn {
            width: 3rem;
            height: 3rem;
            border-radius: 999px;
            border: 1px solid #ddd;
            font-size: 0.9rem;
            background-color: #ffffff;
            color: #222222;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            position: relative;
        }

        .size-btn:hover {
            border-color: #00C853;
        }

        .size-btn-selected {
            background-color: #00C853;
            color: #ffffff;
            border-color: #00C853;
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Navigation Header -->
    <nav class="bg-primary text-white p-4 shadow-lg">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <!-- Left: Logo -->
            <a href="index.HTML" class="text-2xl font-bold hover-text-accent">
                SneakerHub
            </a>

            <!-- Right: Nav Links -->
            <div class="flex items-center space-x-6 text-base">
                <a href="index.HTML" class="hover-text-accent font-medium" style="color: rgba(255,255,255,0.85);">
                    Home
                </a>
                <a href="search-products.HTML" class="hover-text-accent font-medium" style="color: rgba(255,255,255,0.85);">
                    Search
                </a>
                <a href="order-tracking.HTML" id="orders-link" class="hover-text-accent font-medium" style="color: rgba(255,255,255,0.85);">
                    My Orders
                </a>
                <a href="cart.HTML" id="cart-link" class="hover-text-accent font-medium" style="color: rgba(255,255,255,0.85);">
                    My Cart
                </a>
                <a href="user-registration.HTML" id="login-link" class="hover-text-accent font-medium" style="color: rgba(255,255,255,0.85);">
                    Login
                </a>
                <button id="logout-btn"
                        class="hidden bg-cta px-4 py-2 rounded hover-bg-cta text-white font-semibold">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-6">
        <div id="product-container" class="bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row">

            <!-- Image with hover zoom -->
            <div class="md:w-1/2 bg-white flex items-center justify-center p-8">
                <div class="overflow-hidden rounded-2xl">
                    <img
                        id="product-image"
                        src=""
                        alt=""
                        onerror="this.src='https://placehold.co/400x400?text=No+Image'"
                        class="max-w-full max-h-[550px] object-contain transform transition-transform duration-300 ease-out hover:scale-110"
                    >
                </div>
            </div>

            <!-- Details -->
            <div class="md:w-1/2 p-8 flex flex-col gap-4">
                <div>
                    <h1 id="product-name" class="text-3xl font-bold text-primary mb-2"></h1>
                    <p id="product-price" class="text-2xl font-semibold text-accent mb-2"></p>
                    <p id="product-description" class="text-subtext"></p>
                </div>

                <span id="product-status" class="inline-block text-xs px-3 py-1 rounded bg-accent text-white w-fit"></span>

                <!-- Size selection -->
                <div class="mt-4">
                    <h2 class="font-semibold mb-2 text-primary">Select Size</h2>
                    <div id="size-buttons" class="flex flex-wrap gap-2"></div>
                    <p id="size-error" class="text-sm text-red-600 mt-1 hidden">Please select a size.</p>
                </div>

                <!-- Add to Cart -->
                <button
                    id="add-to-cart-btn"
                    class="mt-6 w-full bg-cta text-white font-semibold py-3 rounded-lg hover-bg-cta text-lg"
                >
                    Add to Cart
                </button>
            </div>
        </div>
    </main>

    <script>
        function getProductIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        // All products (original 4 + 4 new ones from search page)
        const products = {
            'nike-dunks-panda': {
                name: 'Nike Dunks: Panda',
                price: '$119.00',
                description: 'Fashionable black and white dunks.',
                image: '../shoes/nike-pandas.jpg',
                status: 'Available',
                sizes: ['4','5','6','7','8','9','10','11','12']
            },
            'jordan-4s-red-thunders': {
                name: 'Jordan 4s: Red Thunders',
                price: '$450.99',
                description: 'Comfortable everyday sneakers.',
                image: '../shoes/red-thunders.jpg',
                status: 'New Arrival',
                sizes: ['4','5','6','7','8','9','10','11','12']
            },
            'jordan-1s-court-purple': {
                name: 'Jordan 1s: Court Purple',
                price: '$79.99',
                description: 'Stylish high-top shoes with bold purple accents.',
                image: '../shoes/jordan-1s-purple.jpg',
                status: 'Available',
                sizes: ['4','5','6','7','8','9','10','11','12']
            },
            'black-air-force-1s': {
                name: 'Black Air Force 1s',
                price: '$99.99',
                description: 'Classic all-black Air Force 1s for everyday wear.',
                image: '../shoes/air-force-1s.jpg',
                status: 'Available',
                sizes: ['4','5','6','7','8','9','10','11','12']
            },

            // NEW PRODUCTS (from search page)
            'yeezy-boost-350': {
                name: 'Yeezy Boost 350',
                price: '$299.99',
                description: 'Lightweight knit comfort with a bold silhouette.',
                image: '../shoes/yeezy boost 350.jpg',
                status: 'Limited',
                sizes: ['4','5','6','7','8','9','10','11','12']
            },
            'nike-air-max-90': {
                name: 'Nike Air Max 90',
                price: '$149.99',
                description: 'Classic visible Air cushioning for all-day comfort.',
                image: '../shoes/nike airmax 90.jpg',
                status: 'Available',
                sizes: ['4','5','6','7','8','9','10','11','12']
            },
            'jordan-6s-white-infrared': {
                name: 'Jordan 6s: White Infrared',
                price: '$125.99',
                description: 'Low-profile suede sneaker with clean lines.',
                image: '../shoes/Jordan 6s White Infrared.jpg',
                status: 'Available',
                sizes: ['4','5','6','7','8','9','10','11','12']
            },
            'jordan-11s-gamma-blue': {
                name: 'Jordan 11s: Gamma Blue',
                price: '$250.99',
                description: 'Minimalist leather sneaker with a vintage vibe.',
                image: '../shoes/jordan 11s gamma blue.jpg',
                status: 'Available',
                sizes: ['4','5','6','7','8','9','10','11','12']
            }
        };

        let selectedSize = null;
        let currentProductId = null;

        function renderProduct(productId) {
            const product = products[productId];
            if (!product) {
                document.getElementById('product-name').textContent = "Product Not Found";
                return;
            }

            currentProductId = productId;

            document.getElementById('product-name').textContent = product.name;
            document.getElementById('product-price').textContent = product.price;
            document.getElementById('product-description').textContent = product.description;
            document.getElementById('product-image').src = product.image;
            document.getElementById('product-image').alt = product.name;
            document.getElementById('product-status').textContent = product.status;

            const sizeContainer = document.getElementById('size-buttons');
            sizeContainer.innerHTML = '';
            selectedSize = null;
            document.getElementById('size-error').classList.add('hidden');

            product.sizes.forEach(size => {
                const btn = document.createElement('button');
                btn.className = 'size-btn';
                btn.dataset.size = size;
                btn.innerHTML = `<span>${size}</span><span class="size-btn-check"></span>`;

                btn.addEventListener('click', () => {
                    selectedSize = size;
                    document.getElementById('size-error').classList.add('hidden');

                    Array.from(sizeContainer.children).forEach(child => {
                        child.classList.remove('size-btn-selected');
                        const check = child.querySelector('.size-btn-check');
                        if (check) check.textContent = '';
                    });

                    btn.classList.add('size-btn-selected');
                });

                sizeContainer.appendChild(btn);
            });
        }

        function addToCart() {
            if (!selectedSize) {
                document.getElementById('size-error').classList.remove('hidden');
                return;
            }

            const product = products[currentProductId];
            const cartItem = {
                id: currentProductId,
                name: product.name,
                price: product.price,
                size: selectedSize,
                image: product.image,
                quantity: 1
            };

            const existing = JSON.parse(localStorage.getItem('cart') || '[]');
            existing.push(cartItem);
            localStorage.setItem('cart', JSON.stringify(existing));

            alert(`Added ${product.name} (Size ${selectedSize}) to your cart.`);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderProduct(getProductIdFromUrl());
            document.getElementById('add-to-cart-btn').addEventListener('click', addToCart);
        });
    </script>

    <script src="nav.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SneakerHub – My Cart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-primary { background-color: #111111; }
        .bg-accent { background-color: #00C853; }
        .bg-cta { background-color: #FF3D00; }
        .hover-bg-cta:hover { background-color: #e63600; }
        .text-primary { color: #222222; }
        .text-subtext { color: #666666; }
        .text-accent { color: #00C853; }
        
        /* Smooth animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .cart-item {
            animation: slideIn 0.3s ease-out;
        }
        
        /* Button hover effects */
        button:hover {
            transform: translateY(-1px);
        }
        
        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Navigation Header -->
    <nav class="bg-primary text-white p-4 shadow-lg">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <!-- Left: Logo -->
            <a href="index.HTML" class="text-2xl font-bold hover-text-accent">
                SneakerHub
            </a>

            <!-- Right: Nav Links -->
            <div class="flex items-center space-x-6 text-base">
                <a href="index.HTML" class="hover-text-accent font-medium" style="color: rgba(255,255,255,0.85);">
                    Home
                </a>
                <a href="search-products.HTML" class="hover-text-accent font-medium" style="color: rgba(255,255,255,0.85);">
                    Search
                </a>
                <a href="order-tracking.HTML" id="orders-link" class="hover-text-accent font-medium" style="color: rgba(255,255,255,0.85);">
                    My Orders
                </a>
                <a href="cart.HTML" id="cart-link" class="hover-text-accent font-medium relative" style="color: rgba(255,255,255,0.85);">
                    My Cart
                    <span id="cart-badge" class="hidden absolute -top-2 -right-2 bg-cta text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">0</span>
                </a>
                <a href="user-registration.HTML" id="login-link" class="hover-text-accent font-medium" style="color: rgba(255,255,255,0.85);">
                    Login
                </a>
                <button id="logout-btn"
                        class="hidden bg-cta px-4 py-2 rounded hover-bg-cta text-white font-semibold">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Main -->
    <main class="max-w-6xl mx-auto p-6">
        <h1 class="text-3xl font-bold text-primary mb-6">My Cart</h1>

        <!-- Empty state -->
        <div id="empty-cart" class="hidden bg-white rounded-xl shadow p-8 text-center">
            <p class="text-lg text-subtext mb-4">Your cart is currently empty.</p>
            <a href="search-products.HTML"
               class="inline-block bg-accent text-white px-6 py-3 rounded-lg font-semibold hover:opacity-90">
                Browse Sneakers
            </a>
        </div>

        <!-- Cart content -->
        <div id="cart-container" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Items list -->
            <section class="lg:col-span-2 bg-white rounded-xl shadow p-4 md:p-6">
                <h2 class="text-xl font-semibold text-primary mb-4">Items</h2>
                <p class="text-xs text-subtext mb-4">
                    Use the checkbox on each item to choose which sneakers to include in your next checkout.
                </p>
                <div id="cart-items" class="space-y-4"></div>
            </section>

            <!-- Summary -->
            <aside class="bg-white rounded-xl shadow p-4 md:p-6 h-fit">
                <h2 class="text-xl font-semibold text-primary mb-4">Summary (Selected Items)</h2>
                <div class="flex justify-between text-sm mb-2">
                    <span class="text-subtext">Subtotal</span>
                    <span id="subtotal" class="font-medium text-primary">$0.00</span>
                </div>
                <div class="flex justify-between text-sm mb-2">
                    <span class="text-subtext">Estimated Tax (13%)</span>
                    <span id="tax" class="font-medium text-primary">$0.00</span>
                </div>
                <div class="border-t my-3"></div>
                <div class="flex justify-between text-lg font-semibold mb-4">
                    <span>Total</span>
                    <span id="total" class="text-accent">$0.00</span>
                </div>

                <button
                    id="checkout-btn"
                    class="w-full bg-cta text-white py-3 rounded-lg font-semibold hover-bg-cta"
                >
                    Proceed to Checkout
                </button>

                <button
                    id="clear-cart-btn"
                    class="w-full mt-3 border border-gray-300 text-primary py-2 rounded-lg text-sm hover:bg-gray-50"
                >
                    Clear Cart
                </button>
            </aside>
        </div>
    </main>

    <script>
        let cartItems = [];

        function parsePrice(priceStr) {
            const num = Number(priceStr.replace(/[^0-9.-]+/g, ''));
            return isNaN(num) ? 0 : num;
        }

        function formatMoney(value) {
            return '$' + value.toFixed(2);
        }

        function loadCartFromStorage() {
            const raw = JSON.parse(localStorage.getItem('cart') || '[]');

            const merged = [];
            raw.forEach(item => {
                const keyIndex = merged.findIndex(
                    x => x.id === item.id && x.size === item.size
                );
                if (keyIndex >= 0) {
                    merged[keyIndex].quantity += item.quantity || 1;
                } else {
                    merged.push({
                        id: item.id,
                        name: item.name,
                        price: item.price,
                        size: item.size,
                        image: item.image,          
                        quantity: item.quantity || 1,
                        selected: item.selected !== false 
                    });
                }
            });

            cartItems = merged;
            localStorage.setItem('cart', JSON.stringify(cartItems));
        }

        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cartItems));
        }

        // Totals are based ONLY on selected items
        function updateTotals() {
            let subtotal = 0;
            cartItems.forEach(item => {
                if (item.selected !== false) {
                    subtotal += parsePrice(item.price) * item.quantity;
                }
            });

            const tax = subtotal * 0.13;
            const total = subtotal + tax;

            document.getElementById('subtotal').textContent = formatMoney(subtotal);
            document.getElementById('tax').textContent = formatMoney(tax);
            document.getElementById('total').textContent = formatMoney(total);
        }

        function renderCart() {
            const emptyCartDiv = document.getElementById('empty-cart');
            const cartContainer = document.getElementById('cart-container');
            const itemsContainer = document.getElementById('cart-items');

            if (!cartItems.length) {
                emptyCartDiv.classList.remove('hidden');
                cartContainer.classList.add('hidden');
                updateTotals();
                return;
            }

            emptyCartDiv.classList.add('hidden');
            cartContainer.classList.remove('hidden');

            itemsContainer.innerHTML = '';

            cartItems.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'cart-item flex flex-col md:flex-row items-center justify-between gap-4 border-b pb-4 last:border-b-0';

                const infoDiv = document.createElement('div');
                infoDiv.className = 'flex-1';

                infoDiv.innerHTML = `
                    <div class="flex items-center gap-4">
                        <img 
                            src="${item.image || ''}" 
                            alt="${item.name}" 
                            class="w-20 h-20 object-cover rounded-md border"
                            onerror="this.src='https://placehold.co/80x80?text=No+Image';">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <input type="checkbox" class="select-check h-4 w-4 rounded border-gray-300">
                                <span class="text-xs text-subtext">Include in checkout</span>
                            </div>
                            <p class="font-semibold text-primary text-base">${item.name}</p>
                            <p class="text-sm text-subtext">
                                Size: <span class="font-medium">${item.size}</span>
                            </p>
                            <p class="text-sm text-subtext mt-1">
                                Price: <span class="font-medium">${item.price}</span>
                            </p>
                        </div>
                    </div>
                `;

                const selectCheckbox = infoDiv.querySelector('.select-check');
                selectCheckbox.checked = item.selected !== false;
                selectCheckbox.addEventListener('change', () => {
                    item.selected = selectCheckbox.checked;
                    saveCart();
                    updateTotals();
                });

                const qtyDiv = document.createElement('div');
                qtyDiv.className = 'flex items-center gap-2';

                const minusBtn = document.createElement('button');
                minusBtn.textContent = '-';
                minusBtn.className = 'w-8 h-8 border border-gray-300 rounded-lg flex items-center justify-center text-lg';
                minusBtn.addEventListener('click', () => {
                    if (item.quantity > 1) {
                        item.quantity -= 1;
                    } else {
                        cartItems.splice(index, 1);
                    }
                    saveCart();
                    renderCart();
                    updateTotals();
                });

                const qtySpan = document.createElement('span');
                qtySpan.textContent = item.quantity;
                qtySpan.className = 'w-8 text-center';

                const plusBtn = document.createElement('button');
                plusBtn.textContent = '+';
                plusBtn.className = 'w-8 h-8 border border-gray-300 rounded-lg flex items-center justify-center text-lg';
                plusBtn.addEventListener('click', () => {
                    item.quantity += 1;
                    saveCart();
                    renderCart();
                    updateTotals();
                });

                qtyDiv.appendChild(minusBtn);
                qtyDiv.appendChild(qtySpan);
                qtyDiv.appendChild(plusBtn);

                const rightDiv = document.createElement('div');
                rightDiv.className = 'flex flex-col items-end gap-2';

                const lineTotal = parsePrice(item.price) * item.quantity;
                const lineTotalSpan = document.createElement('span');
                lineTotalSpan.textContent = formatMoney(lineTotal);
                lineTotalSpan.className = 'font-semibold text-primary';

                const removeBtn = document.createElement('button');
                removeBtn.textContent = 'Remove';
                removeBtn.className = 'text-xs text-red-600 hover:underline';
                removeBtn.addEventListener('click', () => {
                    cartItems.splice(index, 1);
                    saveCart();
                    renderCart();
                    updateTotals();
                    // Update cart badge
                    if (typeof updateCartBadge === 'function') {
                        updateCartBadge();
                    }
                });

                rightDiv.appendChild(lineTotalSpan);
                rightDiv.appendChild(removeBtn);

                row.appendChild(infoDiv);
                row.appendChild(qtyDiv);
                row.appendChild(rightDiv);

                itemsContainer.appendChild(row);
            });

            updateTotals();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const authToken = localStorage.getItem('authToken');
            if (!authToken) {
                window.location.href = 'user-registration.HTML';
                return;
            }

            loadCartFromStorage();
            renderCart();
            
            // Update cart badge
            if (typeof updateCartBadge === 'function') {
                updateCartBadge();
            }

            const clearCartBtn = document.getElementById('clear-cart-btn');
            clearCartBtn.addEventListener('click', () => {
                if (confirm('Are you sure you want to clear your cart?')) {
                    cartItems = [];
                    saveCart();
                    renderCart();
                    updateTotals();
                    // Update cart badge
                    if (typeof updateCartBadge === 'function') {
                        updateCartBadge();
                    }
                }
            });

            const checkoutBtn = document.getElementById('checkout-btn');
            checkoutBtn.addEventListener('click', () => {
                const selectedItems = cartItems.filter(item => item.selected !== false);
                if (!selectedItems.length) {
                    alert('Please select at least one item to proceed to checkout.');
                    return;
                }

                // Save selection for checkout page
                localStorage.setItem('checkoutItems', JSON.stringify(selectedItems));
                window.location.href = 'checkout-page.html';
            });
        });
    </script>

    <script src="nav.js"></script>
</body>
</html>
